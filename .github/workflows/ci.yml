name: ci

on: 
  - pull_request

permissions: read-all

jobs:
  validate:
    name: Lint and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        
      - name: Tests
        run: npm run test
